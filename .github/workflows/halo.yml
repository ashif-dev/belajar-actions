name: Robot Pertama

on: workflow_dispatch

jobs:
  menyapa:
    runs-on: ubuntu-latest
    steps:
      - name: Langkah satu
        run: echo "Ini dikerjakan pertama"

      - name: Langkah dua
        run: echo "Ini dikerjakan kedua"

      - name: Lihat kita ada di komputer apa
        run: |
          echo "Nama komputer: $(hostname)"
          echo "Sistem operasi:"
          cat /etc/os-release | head -2
          echo "Isi folder saat ini:"
          ls -la
